apiVersion: v1
kind: Namespace
metadata:
  name: control-plane-demo
  labels:
    control-plane.lacaja/managed: "true"
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-quota
  namespace: control-plane-demo
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "20"
    count/deployments.apps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-limits
  namespace: control-plane-demo
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
